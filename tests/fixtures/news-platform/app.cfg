version(1);

// Stub endpoints, dispatched through the same generated router as application routes.
route('home', '/', (context) => {});
route('empty', '/empty', (context) => {});

collection('user', () => {
  field('displayName', { type: 'string' });
});

collection('password', () => {
  field('hash', { type: 'string' });
  singleChildOf('user');
});

collection('$session', () => {
  singleChildOf('user');
});

collection('profile', () => {
  field('bio', { type: 'string', optional: true });
  singleChildOf('user');
});

collection('email', () => {
  field('address', { type: 'string' });
  field('isPrimary', { type: 'boolean' });
  multipleChildOf('user');
  unique('uniqueAddressPerUser', { target: ['user', 'address'] });
  constraint('uniquePrimaryPerUser', { target: ['user'], filter: { isPrimary: true } });
  checkUpdate('atLeastOnePrimary', (context) => {
    return exists('email', { user: context.new.user.id, isPrimary: true });
  });
});

collection('event', () => {
  field('occurredWhen', { type: 'timestamp' });
  field('label', { type: 'string' });
});

collection('eventSource', () => {
  field('title', { type: 'string' });
  field('url', { type: 'string' });
  field('reportedWhen', { type: 'timestamp' });
  multipleChildOf('event');
});

collection('timeline', () => {
  field('title', { type: 'string' });
  multipleChildOf('user', { alias: 'creator' } );
});

collection('timelineEvent', () => {
  connects('event', 'timeline');
  multipleChildOf('user', { alias: 'creator' } );
});

route('profile', '/profile/:id', (context) => {
  let profile = query('getProfile', {
    collection: 'user',
    where: { id: context.route.id },
    relations: { profile: true, email: { where: { isPrimary: true } } }
  });
});

route('timeline', '/timeline/:id', (context) => {
  let timeline = query('getTimeline', {
    collection: 'timeline',
    where: { id: context.route.id },
    relations: { timelineEvent: { relations: {
      creator: true,
      event: true,
    } } }
  });
});

// Exercises a continuation with two retained query results.
route('profileSummary', '/profile-summary/:id', (context) => {
  let profile = query('getProfile', {
    collection: 'user',
    where: { id: context.route.id },
    relations: { profile: true }
  });
  let contact = query('getContact', {
    collection: 'user',
    where: { id: context.route.id },
    relations: { email: { where: { isPrimary: true } } }
  });
});
